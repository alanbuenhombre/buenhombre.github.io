# Construye la app de escritorio «MED Maquetador» para macOS (Apple Silicon e Intel) y la publica
# como release de GitHub. Se lanza a mano desde la pestaña Actions (workflow_dispatch).
name: MED Maquetador · app de Mac

on:
  workflow_dispatch:
    inputs:
      version:
        description: Versión (por ejemplo 0.2.0)
        required: true
        default: '0.2.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: med/maquetador
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependencias (Apple Silicon) + binarios de sharp para Intel
        run: |
          npm ci
          npm install --no-save --os=darwin --cpu=x64 sharp
      - name: Versión
        run: npm version "${{ inputs.version }}" --no-git-tag-version
      - name: Pruebas rápidas (sin navegador)
        run: node --test tests/recorte.test.js tests/guia.test.js tests/red.test.js
      - name: Empaquetar (zip, arm64 + x64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --arm64 --x64 --publish never
      - name: Listar
        run: ls -la dist/*.zip
      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: med-app-v${{ inputs.version }}
          name: MED Maquetador ${{ inputs.version }} (macOS)
          files: med/maquetador/dist/*.zip
          body: |
            App de escritorio local de MED Maquetador para macOS. Sin internet, sin IA.

            **Descarga:** `MED Maquetador-${{ inputs.version }}-arm64-mac.zip` para Mac con chip Apple (M1, M2, M3, M4);
            `MED Maquetador-${{ inputs.version }}-mac.zip` para Mac con Intel.

            **Primera apertura:** doble clic en el zip; arrastra «MED Maquetador» a Aplicaciones;
            clic derecho → Abrir. Si macOS dice que no puede verificar la app: Ajustes del Sistema →
            Privacidad y seguridad → «Abrir de todos modos» (una sola vez).

            Los proyectos se guardan en Documentos/MED maquetador/proyectos.
